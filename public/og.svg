<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="paper" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.6" fill="#786446" opacity="0.06"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="630" fill="#efe7d6"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#paper)"/>

  <!-- Logo -->
  <rect x="80" y="72" width="56" height="56" rx="12" fill="#1d1813"/>
  <text x="108" y="116" font-family="'Newsreader', serif" font-size="36" font-style="italic" font-weight="600" text-anchor="middle" fill="#faf5e8">Z</text>
  <text x="156" y="105" font-family="'Geist', system-ui, sans-serif" font-size="22" font-weight="600" fill="#1d1813" letter-spacing="-0.01em">Zentra</text>
  <text x="156" y="125" font-family="'Geist Mono', monospace" font-size="11" fill="#6b6253" letter-spacing="0.14em">COLLECT</text>

  <!-- Kicker -->
  <text x="80" y="240"
        font-family="'Geist Mono', monospace"
        font-size="16"
        fill="#6b6253"
        letter-spacing="0.16em">COLLECTIONS DECISIONING · FOR UK BOOKKEEPERS</text>

  <!-- Headline (serif) -->
  <text x="80" y="320"
        font-family="'Newsreader', 'Times New Roman', serif"
        font-size="72"
        font-weight="500"
        fill="#1d1813"
        letter-spacing="-0.02em">Upload overdue invoices.</text>
  <text x="80" y="400"
        font-family="'Newsreader', 'Times New Roman', serif"
        font-size="72"
        font-weight="500"
        fill="#1d1813"
        letter-spacing="-0.02em">Get a ranked chase plan.</text>

  <!-- Sub -->
  <text x="80" y="470"
        font-family="'Geist', system-ui, sans-serif"
        font-size="22"
        fill="#6b6253">Action + reason + draft message — you review and send.</text>

  <!-- Pill -->
  <rect x="80" y="510" width="240" height="48" rx="24" fill="#1d1813"/>
  <text x="200" y="540"
        font-family="'Geist', system-ui, sans-serif"
        font-size="16"
        font-weight="500"
        text-anchor="middle"
        fill="#faf5e8">zentracollect.co.uk</text>
</svg>
